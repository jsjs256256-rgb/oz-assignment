<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사칙연산 계산기</title>
    <!-- defer: HTML을 다 읽은 뒤에 JS 실행 -->
    <script src="calculator.js" defer></script>
</head>
<body>
    <h1>콘솔창 계산기 프로그램</h1>

    <h3>Window OS의 경우</h3>
    <hr>
    <p>1. F12 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>

    <h3>Mac OS의 경우</h3>
    <hr>
    <p>1. Option + Command + i 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>

    <h3>사용 예시</h3>
    <hr>
    <p>start() → 입력창에 1 + 2 * 3 - 4 / 2 입력 → 결과: 5</p>
    <p>start("10 - 2 * 3 + 8 / 4") 처럼 계산식을 바로 넣어도 됩니다.</p>
</body>
</html>
